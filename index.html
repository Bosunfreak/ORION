<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>O.R.I.O.N.</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background:
                radial-gradient(
                    circle at center top,
                    #0b1930 0%,
                    #050914 45%,
                    #02040a 100%
                );

            color: #e8fbff;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow-x: hidden;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 900px;

            max-width: 92vw;

            text-align: center;

            padding: 30px 0;
        }


        /* =========================
           AI CORE
        ========================= */

        .core-wrapper {

            width: 230px;

            height: 230px;

            margin: 0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;
        }


        .core {

            width: 190px;

            height: 190px;

            border: 3px solid #00e5ff;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            box-shadow:

                0 0 12px #00e5ff,

                0 0 35px rgba(
                    0,
                    229,
                    255,
                    0.8
                ),

                inset 0 0 30px rgba(
                    0,
                    229,
                    255,
                    0.2
                );

            animation:
                coreIdle
                3s
                infinite
                ease-in-out;

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }


        .core-inner {

            width: 85px;

            height: 85px;

            border-radius: 50%;

            background: #00e5ff;

            box-shadow:

                0 0 15px #00e5ff,

                0 0 35px #00e5ff,

                0 0 70px #00e5ff;

            animation:
                innerIdle
                2.5s
                infinite
                ease-in-out;
        }


        .core-ring {

            position: absolute;

            width: 135px;

            height: 135px;

            border-radius: 50%;

            border: 1px solid rgba(
                0,
                229,
                255,
                0.7
            );

            border-left-color:
                transparent;

            border-right-color:
                transparent;

            animation:
                ringRotate
                8s
                linear
                infinite;
        }


        /* =========================
           IDLE ANIMATION
        ========================= */

        @keyframes coreIdle {

            0% {

                transform:
                    scale(1);

                box-shadow:

                    0 0 12px #00e5ff,

                    0 0 35px rgba(
                        0,
                        229,
                        255,
                        0.7
                    ),

                    inset 0 0 30px rgba(
                        0,
                        229,
                        255,
                        0.2
                    );
            }

            50% {

                transform:
                    scale(1.035);

                box-shadow:

                    0 0 20px #00e5ff,

                    0 0 55px rgba(
                        0,
                        229,
                        255,
                        0.9
                    ),

                    inset 0 0 40px rgba(
                        0,
                        229,
                        255,
                        0.35
                    );
            }

            100% {

                transform:
                    scale(1);

                box-shadow:

                    0 0 12px #00e5ff,

                    0 0 35px rgba(
                        0,
                        229,
                        255,
                        0.7
                    ),

                    inset 0 0 30px rgba(
                        0,
                        229,
                        255,
                        0.2
                    );
            }

        }


        @keyframes innerIdle {

            0% {

                transform:
                    scale(0.9);

                opacity: 0.8;
            }

            50% {

                transform:
                    scale(1.05);

                opacity: 1;
            }

            100% {

                transform:
                    scale(0.9);

                opacity: 0.8;
            }

        }


        @keyframes ringRotate {

            from {

                transform:
                    rotate(0deg);
            }

            to {

                transform:
                    rotate(360deg);
            }

        }


        /* =========================
           THINKING MODE
        ========================= */

        .thinking .core {

            animation:
                coreThinking
                0.8s
                infinite
                ease-in-out;
        }


        .thinking .core-inner {

            animation:
                innerThinking
                0.45s
                infinite
                alternate;
        }


        .thinking .core-ring {

            animation:
                ringRotate
                1.5s
                linear
                infinite;
        }


        @keyframes coreThinking {

            0% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.09);
            }

            100% {

                transform:
                    scale(1);
            }

        }


        @keyframes innerThinking {

            from {

                transform:
                    scale(0.75);
            }

            to {

                transform:
                    scale(1.15);
            }

        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            color: #00e5ff;

            letter-spacing: 7px;

            margin:
                5px 0 8px;

            font-size: 32px;

            text-shadow:

                0 0 10px #00e5ff,

                0 0 25px #00e5ff,

                0 0 45px rgba(
                    0,
                    229,
                    255,
                    0.5
                );
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            color: #00e5ff;

            font-size: 14px;

            margin-bottom: 25px;

            text-shadow:
                0 0 8px #00e5ff;

            transition: 0.3s;
        }


        /* =========================
           CHAT
        ========================= */

        .chat {

            width: 100%;

            height: 350px;

            background:

                linear-gradient(
                    180deg,
                    rgba(
                        10,
                        16,
                        32,
                        0.96
                    ),
                    rgba(
                        5,
                        10,
                        20,
                        0.96
                    )
                );

            border:
                1px solid #00e5ff;

            padding: 20px;

            text-align: left;

            overflow-y: auto;

            border-radius: 10px;

            box-shadow:

                0 0 15px rgba(
                    0,
                    229,
                    255,
                    0.25
                ),

                inset 0 0 30px rgba(
                    0,
                    229,
                    255,
                    0.05
                );

            font-family:
                Consolas,
                monospace;

            font-size: 15px;

            line-height: 1.5;

            scroll-behavior:
                smooth;
        }


        /* =========================
           MESSAGES
        ========================= */

        .message {

            margin-bottom: 15px;

            padding:
                10px 14px;

            border-radius: 8px;

            max-width: 90%;

            animation:
                messageAppear
                0.25s
                ease-out;
        }


        .user-message {

            margin-left: auto;

            background:
                rgba(
                    0,
                    229,
                    255,
                    0.08
                );

            border:
                1px solid rgba(
                    0,
                    229,
                    255,
                    0.3
                );

            color: white;
        }


        .orion-message {

            margin-right: auto;

            background:
                rgba(
                    0,
                    229,
                    255,
                    0.04
                );

            border-left:
                3px solid #00e5ff;

            color:
                #e8fbff;
        }


        .message-name {

            color:
                #00e5ff;

            font-weight:
                bold;

            margin-bottom:
                4px;
        }


        @keyframes messageAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================
           THINKING DOTS
        ========================= */

        .thinking-dots span {

            animation:
                thinkingDots
                1.2s
                infinite;
        }


        .thinking-dots
        span:nth-child(2) {

            animation-delay:
                0.2s;
        }


        .thinking-dots
        span:nth-child(3) {

            animation-delay:
                0.4s;
        }


        @keyframes thinkingDots {

            0% {

                opacity:
                    0.2;
            }

            50% {

                opacity:
                    1;
            }

            100% {

                opacity:
                    0.2;
            }

        }


        /* =========================
           INPUT AREA
        ========================= */

        .input-area {

            margin-top:
                15px;

            display:
                flex;

            gap:
                8px;

            width:
                100%;
        }


        input {

            flex:
                1;

            min-width:
                0;

            padding:
                14px;

            background:
                #111b2e;

            border:
                1px solid #00e5ff;

            border-radius:
                20px;

            color:
                white;

            font-size:
                16px;

            outline:
                none;

            box-shadow:

                0 0 8px rgba(
                    0,
                    229,
                    255,
                    0.15
                );

            transition:
                0.2s;
        }


        input:focus {

            box-shadow:

                0 0 15px rgba(
                    0,
                    229,
                    255,
                    0.5
                );
        }


        input::placeholder {

            color:
                #6f9aa5;
        }


        /* =========================
           SEND BUTTON
        ========================= */

        button {

            flex-shrink:
                0;

            width:
                58px;

            height:
                48px;

            padding:
                0;

            background:
                #111b2e;

            border:
                1px solid #00e5ff;

            border-radius:
                50%;

            color:
                #00e5ff;

            cursor:
                pointer;

            font-weight:
                bold;

            font-size:
                17px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            transition:
                0.2s;
        }


        button:hover {

            background:
                #00e5ff;

            color:
                #050914;

            box-shadow:
                0 0 18px #00e5ff;
        }


        button:active {

            transform:
                scale(0.92);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                width:
                    94vw;

                padding:
                    20px 0;
            }


            .core-wrapper {

                width:
                    190px;

                height:
                    190px;
            }


            .core {

                width:
                    160px;

                height:
                    160px;
            }


            .core-inner {

                width:
                    70px;

                height:
                    70px;
            }


            .core-ring {

                width:
                    115px;

                height:
                    115px;
            }


            h1 {

                font-size:
                    25px;

                letter-spacing:
                    5px;
            }


            .chat {

                height:
                    350px;

                font-size:
                    14px;

                padding:
                    15px;
            }


            .input-area {

                display:
                    flex;

                flex-direction:
                    row;

                gap:
                    7px;
            }


            input {

                height:
                    48px;

                font-size:
                    15px;
            }


            button {

                width:
                    48px;

                height:
                    48px;

                font-size:
                    15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         AI CORE
    ========================== -->

    <div
        class="core-wrapper"
        id="coreWrapper"
    >

        <div class="core">

            <div class="core-ring"></div>

            <div class="core-inner"></div>

        </div>

    </div>


    <!-- TITLE -->

    <h1>
        O.R.I.O.N.
    </h1>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >

        ● SYSTEM ONLINE

    </div>


    <!-- CHAT -->

    <div
        class="chat"
        id="chat"
    >

        <div class="message orion-message">

            <div class="message-name">
                O.R.I.O.N. &gt;
            </div>

            SYSTEM ONLINE.

        </div>


        <div class="message orion-message">

            <div class="message-name">
                O.R.I.O.N. &gt;
            </div>

            AI CORE INITIALIZING...

        </div>


        <div class="message orion-message">

            <div class="message-name">
                O.R.I.O.N. &gt;
            </div>

            Awaiting your command...

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Typ een commando..."
            autocomplete="off"
        >


        <button
            onclick="sendMessage()"
            aria-label="Verstuur bericht"
        >

            ➤

        </button>

    </div>


</div>



<script>


/* ==========================================
   ELEMENTS
========================================== */

const input =
    document.getElementById(
        "message"
    );


const chat =
    document.getElementById(
        "chat"
    );


const status =
    document.getElementById(
        "status"
    );


const coreWrapper =
    document.getElementById(
        "coreWrapper"
    );


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (message === "") {

        return;

    }


    /* USER MESSAGE */

    addMessage(
        "JIJ",
        message,
        "user-message"
    );


    input.value = "";


    /* ==========================================
       LOCAL COMMANDS
    ========================================== */

    const lower =
        message.toLowerCase();


    /* TIME */

    if (
        lower.includes("hoe laat") ||
        lower.includes("tijd")
    ) {

        const now =
            new Date();


        const time =
            now.toLocaleTimeString(
                "nl-BE",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            );


        addMessage(
            "O.R.I.O.N.",
            "Het is momenteel " +
            time +
            ".",
            "orion-message"
        );


        return;

    }


    /* GOOGLE */

    if (
        lower.includes(
            "open google"
        )
    ) {

        addMessage(
            "O.R.I.O.N.",
            "Google wordt geopend.",
            "orion-message"
        );


        window.open(
            "https://www.google.com",
            "_blank"
        );


        return;

    }


    /* YOUTUBE */

    if (
        lower.includes(
            "open youtube"
        )
    ) {

        addMessage(
            "O.R.I.O.N.",
            "YouTube wordt geopend.",
            "orion-message"
        );


        window.open(
            "https://www.youtube.com",
            "_blank"
        );


        return;

    }


    /* MINECRAFT SEARCH */

    if (
        lower.includes(
            "zoek minecraft"
        ) ||
        lower.includes(
            "zoek naar minecraft"
        )
    ) {

        addMessage(
            "O.R.I.O.N.",
            "Ik zoek Minecraft voor je.",
            "orion-message"
        );


        window.open(
            "https://www.google.com/search?q=Minecraft",
            "_blank"
        );


        return;

    }


    /* ==========================================
       THINKING
    ========================================== */

    startThinking();


    const thinkingMessage =
        addThinkingMessage();


    try {

        const response =
            await fetch(
                "/ask",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        thinkingMessage.remove();


        addMessage(
            "O.R.I.O.N.",
            data.answer ||
            "Ik heb geen antwoord ontvangen.",
            "orion-message"
        );


        stopThinking();

    }


    catch (error) {

        console.error(error);


        thinkingMessage.remove();


        addMessage(
            "O.R.I.O.N.",
            "Verbinding met mijn AI-core mislukt.",
            "orion-message"
        );


        status.textContent =
            "● AI CONNECTION ERROR";


        stopThinking();

    }

}


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(
    name,
    text,
    className
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        className;


    const nameElement =
        document.createElement(
            "div"
        );


    nameElement.className =
        "message-name";


    nameElement.textContent =
        name + " >";


    const textElement =
        document.createElement(
            "div"
        );


    textElement.textContent =
        text;


    message.appendChild(
        nameElement
    );


    message.appendChild(
        textElement
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* ==========================================
   THINKING MESSAGE
========================================== */

function addThinkingMessage() {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message orion-message";


    message.innerHTML = `

        <div class="message-name">
            O.R.I.O.N. &gt;
        </div>

        <div class="thinking-dots">

            Ik denk na
            <span>.</span>
            <span>.</span>
            <span>.</span>

        </div>

    `;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    return message;

}


/* ==========================================
   START THINKING
========================================== */

function startThinking() {

    coreWrapper.classList.add(
        "thinking"
    );


    status.textContent =
        "● O.R.I.O.N. IS THINKING...";

}


/* ==========================================
   STOP THINKING
========================================== */

function stopThinking() {

    coreWrapper.classList.remove(
        "thinking"
    );


    status.textContent =
        "● SYSTEM ONLINE";

}


/* ==========================================
   ENTER = SEND
========================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==========================================
   START
========================================== */

input.focus();


</script>


</body>

</html>
